              f"- `asset_roots`: `{summary['so101_model_bundle_manifest']['asset_roots']['asset_roots']}`",
              f"- `diagnostic_only`: `{summary['so101_model_bundle_manifest']['forwarding']['diagnostic_only']}`",
              f"- `diagnostic_only_reason`: `{summary['so101_model_bundle_manifest']['forwarding']['diagnostic_only_reason']}`",
              "",
              "SO-101 reviewed MuJoCo bundle gate:",
              f"- `status`: `{summary['so101_reviewed_mujoco_bundle']['status']}`",
              f"- `model_authority`: `{summary['so101_reviewed_mujoco_bundle']['model_authority']}`",
              f"- `physical_so101_model_authority_ready`: `{summary['so101_reviewed_mujoco_bundle']['physical_so101_model_authority_ready']}`",
              f"- `hardware_free_regression_fixture_ready`: `{summary['so101_reviewed_mujoco_bundle']['hardware_free_regression_fixture_ready']}`",
              f"- `ready_for_model_backed_ik`: `{summary['so101_reviewed_mujoco_bundle']['ready_for_model_backed_ik']}`",
              f"- `reviewed_model_motion_checked`: `{summary['so101_reviewed_mujoco_bundle']['reviewed_model_motion_checked']}`",
              f"- `missing_inputs`: `{summary['so101_reviewed_mujoco_bundle']['missing_inputs']}`",
              "",
              "SO-101 model contract:",
              f"- `ik_model_path`: `{summary['so101_model_contract_config']['ik_model_path']}`",
              f"- `ik_model_asset_roots`: `{summary['so101_model_contract_config']['ik_model_asset_roots']}`",
              "- Asset roots are forwarded only to the contract checker's nested asset preflight.",
              "",
          ]
          rendered = "\n".join(lines) + "\n"
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as step_summary:
              step_summary.write(rendered)
          print(rendered)
          PY

      - name: Upload calibration regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CALIBRATION_REGRESSION_ARTIFACT_NAME }}
          path: ${{ env.CALIBRATION_REGRESSION_OUTPUT_DIR }}
          if-no-files-found: warn
