name: Simulator Calibration Regression

on:
  workflow_dispatch:

  pull_request:
    branches:
      - feat/telemetry-recording
    paths:
      - "archive/chess_test_images/current_view.jpg"
      - "docs/sim_calibration_regression.md"
      - "docs/sim_reference_capture_manifest.md"
      - "docs/sim_reference_media_inventory.md"
      - "docs/sim_so101_chess_env.md"
      - "docs/sim_so101_env_resets.md"
      - "docs/sim_so101_model_asset_preflight.md"
      - "docs/sim_so101_model_bundle_manifest.md"
      - "docs/sim_so101_model_contract.md"
      - "docs/sim_so101_model_source_inventory.md"
      - "docs/sim_so101_reviewed_mujoco_bundle.md"
      - "docs/sim_so101_mujoco_board_pick_probe.md"
      - "docs/sim_so101_mujoco_contact_probe.md"
      - "docs/sim_so101_mujoco_grasp_probe.md"
      - "docs/sim_so101_mujoco_scene.md"
      - "docs/sim_so101_training_rollouts.md"
      - "llm-tools/**"
      - "README.md"
      - "scripts/render_sim_*.py"
      - "scripts/smoke_sim_*.py"
      - "skills/**"
      - "src/lerobot/cameras/**"
      - "src/lerobot/configs/chessboard.py"
      - "src/lerobot/perception/chess/**"
      - "src/lerobot/sim/**"
      - "src/lerobot/utils/geometry.py"
      - ".github/workflows/sim_calibration_regression.yml"

  push:
    branches:
      - feat/telemetry-recording
    paths:
      - "archive/chess_test_images/current_view.jpg"
      - "docs/sim_calibration_regression.md"
      - "docs/sim_reference_capture_manifest.md"
      - "docs/sim_reference_media_inventory.md"
      - "docs/sim_so101_chess_env.md"
      - "docs/sim_so101_env_resets.md"
      - "docs/sim_so101_model_asset_preflight.md"
      - "docs/sim_so101_model_bundle_manifest.md"
      - "docs/sim_so101_model_contract.md"
      - "docs/sim_so101_model_source_inventory.md"
      - "docs/sim_so101_reviewed_mujoco_bundle.md"
      - "docs/sim_so101_mujoco_board_pick_probe.md"
      - "docs/sim_so101_mujoco_contact_probe.md"
      - "docs/sim_so101_mujoco_grasp_probe.md"
      - "docs/sim_so101_mujoco_scene.md"
      - "docs/sim_so101_training_rollouts.md"
      - "llm-tools/**"
      - "README.md"
      - "scripts/render_sim_*.py"
      - "scripts/smoke_sim_*.py"
      - "skills/**"
      - "src/lerobot/cameras/**"
      - "src/lerobot/configs/chessboard.py"
      - "src/lerobot/perception/chess/**"
      - "src/lerobot/sim/**"
      - "src/lerobot/utils/geometry.py"
      - ".github/workflows/sim_calibration_regression.yml"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  CALIBRATION_REGRESSION_OUTPUT_DIR: "/tmp/lerobot_sim/calibration_regression_suite"
  CALIBRATION_REGRESSION_ARTIFACT_NAME: "sim-calibration-regression-${{ github.run_id }}"
  REFERENCE_MEDIA_ROOTS: ""
  REFERENCE_CAPTURE_MANIFEST: ""
  IK_MODEL_PATH: ""
  IK_MODEL_ASSET_ROOTS: ""
  SO101_MODEL_BUNDLE_MANIFEST: ""
  SO101_MODEL_SOURCE_ROOTS: ""
  SO101_MODEL_SOURCE_EXTRA_ROOTS: ""
  SO101_AUTHORITATIVE_MODEL_PATHS: ""
  SO101_AUTHORITATIVE_MODEL_ROOTS: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  sim-calibration-regression:
    name: Hardware-free calibration gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install suite dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            deepdiff \
            draccus \
            gymnasium \
            huggingface-hub \
            mujoco \
            numpy \
            opencv-python-headless \
            pyserial \
            "torch>=2.2.1,<2.8.0" \
            tqdm

      - name: Run simulator calibration regression suite
        run: |
          append_repeatable_args() {
            local flag="$1"
            local values="$2"
            if [ -z "${values}" ]; then
              return 0
            fi
            while IFS= read -r value; do
              if [ -n "${value}" ]; then
                cmd+=("${flag}" "${value}")
              fi
            done <<< "${values}"
          }

          cmd=(
            python
            scripts/smoke_sim_calibration_regression_suite.py
            --output-dir "${CALIBRATION_REGRESSION_OUTPUT_DIR}"
            --python "$(python -c 'import sys; print(sys.executable)')"
            --include-negative-check
          )
          append_repeatable_args --reference-media-root "${REFERENCE_MEDIA_ROOTS}"
          if [ -n "${REFERENCE_CAPTURE_MANIFEST}" ]; then
            cmd+=(--reference-capture-manifest "${REFERENCE_CAPTURE_MANIFEST}")
          fi
          if [ -n "${IK_MODEL_PATH}" ]; then
            cmd+=(--ik-model-path "${IK_MODEL_PATH}")
          fi
          if [ -n "${SO101_MODEL_BUNDLE_MANIFEST}" ]; then
            cmd+=(--so101-model-bundle-manifest "${SO101_MODEL_BUNDLE_MANIFEST}")
          fi
          append_repeatable_args --ik-model-asset-root "${IK_MODEL_ASSET_ROOTS}"
          append_repeatable_args --so101-model-source-root "${SO101_MODEL_SOURCE_ROOTS}"
          append_repeatable_args --so101-model-source-extra-root "${SO101_MODEL_SOURCE_EXTRA_ROOTS}"
          append_repeatable_args --so101-authoritative-model-path "${SO101_AUTHORITATIVE_MODEL_PATHS}"
          append_repeatable_args --so101-authoritative-model-root "${SO101_AUTHORITATIVE_MODEL_ROOTS}"
          "${cmd[@]}"

      - name: Check regression summary
        run: |
          python - <<'PY'
          import json
          import os
          from numbers import Real
          from pathlib import Path

          summary_path = Path(os.environ["CALIBRATION_REGRESSION_OUTPUT_DIR"]) / "calibration_regression_summary.json"
          summary = json.loads(summary_path.read_text())

          def assert_json_number(value, label):
              assert isinstance(value, Real) and not isinstance(value, bool), (label, value)

          assert summary["ok"] is True, summary["aggregate_status"]
          assert summary["status"] == "ok", summary["status"]
          assert summary["hardware_skipped"] is True
          assert summary["gui_skipped"] is True
          reference_inventory = summary["reference_media_inventory"]
          assert reference_inventory["ok"] is True, reference_inventory
          assert reference_inventory["status"] in {
              "media_inventory_complete",
              "media_inventory_empty",
          }, reference_inventory
          assert isinstance(reference_inventory["candidate_count"], int), reference_inventory
          assert isinstance(reference_inventory["image_count"], int), reference_inventory
          assert isinstance(reference_inventory["video_count"], int), reference_inventory
          assert isinstance(reference_inventory["calibration_data_count"], int), reference_inventory
          assert isinstance(reference_inventory["currently_wired_media_count"], int), reference_inventory
          assert isinstance(reference_inventory["reference_gaps"], list), reference_inventory
          inventory_configuration = reference_inventory["source_configuration"]
          expected_reference_scan_mode = "explicit_roots" if os.environ["REFERENCE_MEDIA_ROOTS"].strip() else "repo_root_only"
          assert inventory_configuration["scan_mode"] == expected_reference_scan_mode, inventory_configuration
          inventory_child = summary["child_commands"]["reference_media_inventory"]
          assert inventory_child["ok"] is True, inventory_child
          assert inventory_child["summary_status"] == reference_inventory["status"], inventory_child
          assert inventory_child["diagnostics"]["candidate_count"] == reference_inventory["candidate_count"], inventory_child
          reference_inventory_artifacts = reference_inventory["artifact_paths"]
          for key in ("summary_json", "csv", "readme_md"):
              assert isinstance(reference_inventory_artifacts.get(key), str) and Path(reference_inventory_artifacts[key]).is_file(), (
                  key,
                  reference_inventory_artifacts,
              )
          if not os.environ["REFERENCE_MEDIA_ROOTS"].strip():
              assert reference_inventory["candidate_count"] > 0, reference_inventory
              assert reference_inventory["image_count"] > 0, reference_inventory
              assert reference_inventory["current_gripper_reference"]["detected"] is True, reference_inventory
              assert reference_inventory["currently_wired_media_count"] >= 1, reference_inventory
              assert "missing_depth_reference" in reference_inventory["reference_gaps"], reference_inventory
              assert "missing_pick_place_video" in reference_inventory["reference_gaps"], reference_inventory
          assert summary["selected_candidate"]["candidate_id"], summary["selected_candidate"]
          if reference_inventory["candidate_count"] > 0:
              assert summary["comparison_set"]["status"] == "ok", summary["comparison_set"]
              assert summary["comparison_set"]["artifacts"], summary["comparison_set"]
          else:
              assert summary["comparison_set"]["status"] == "no_reference_media_selected", summary["comparison_set"]
          tuning = summary["reference_camera_tuning_diagnostics"]
          assert tuning["ok"] is True, tuning
          assert tuning["status"] in {"ok", "metadata_only", "no_reference_media_selected"}, tuning
          assert isinstance(tuning["selected_comparison_count"], int), tuning
          assert isinstance(tuning["visual_comparison_count"], int), tuning
          assert isinstance(tuning["metadata_only_count"], int), tuning
          assert isinstance(tuning["suggested_tuning_dimensions"], list), tuning
          assert tuning["media_assets_copied_into_repo"] is False, tuning
          if reference_inventory["candidate_count"] == 0:
              assert tuning["status"] == "no_reference_media_selected", tuning
          else:
              assert tuning["selected_comparison_count"] > 0, tuning
          assert tuning["missing_depth_reference"] == summary["comparison_set"]["missing_depth_reference"], tuning
          assert tuning["missing_pick_place_video"] == summary["comparison_set"]["missing_pick_place_video"], tuning
          assert tuning["no_videos"] == summary["comparison_set"]["no_videos"], tuning
          tuning_child = summary["child_commands"]["reference_camera_tuning_diagnostics"]
          assert tuning_child["ok"] is True, tuning_child
          assert tuning_child["summary_status"] == tuning["status"], tuning_child
          assert tuning_child["diagnostics"]["selected_comparison_count"] == tuning["selected_comparison_count"], tuning_child
          assert tuning_child["diagnostics"]["media_assets_copied_into_repo"] is False, tuning_child
          tuning_artifacts = tuning["artifact_paths"]
          for key in ("summary_json", "csv_rows", "readme_md"):
              assert isinstance(tuning_artifacts.get(key), str) and Path(tuning_artifacts[key]).is_file(), (
                  key,
                  tuning_artifacts,
              )
          if tuning["scorecard_produced"] is True:
              assert isinstance(tuning["scorecard_path"], str) and Path(tuning["scorecard_path"]).is_file(), tuning
          profile_sweep = summary["sim_camera_profile_sweep"]
          assert profile_sweep["ok"] is True, profile_sweep
          assert profile_sweep["status"] == "ok", profile_sweep
          assert profile_sweep["profile_name"] == "current_gripper_reference", profile_sweep
          assert_json_number(profile_sweep["current_gripper_finger_width_px"], "profile_sweep.current_gripper_finger_width_px")
          assert profile_sweep["marker_time_seconds"] == 0.0, profile_sweep
          assert isinstance(profile_sweep["candidate_count"], int) and profile_sweep["candidate_count"] > 0, profile_sweep
          assert_json_number(profile_sweep["current_mean_abs_delta"], "profile_sweep.current_mean_abs_delta")
          assert_json_number(profile_sweep["current_rmse"], "profile_sweep.current_rmse")
          assert profile_sweep["best_candidate_id"], profile_sweep
          assert profile_sweep["best_candidate_name"], profile_sweep
          assert_json_number(profile_sweep["best_mean_abs_delta"], "profile_sweep.best_mean_abs_delta")
          assert_json_number(profile_sweep["best_rmse"], "profile_sweep.best_rmse")
          assert_json_number(profile_sweep["mean_abs_delta_delta_vs_current"], "profile_sweep.mean_abs_delta_delta_vs_current")
          assert_json_number(profile_sweep["rmse_delta_vs_current"], "profile_sweep.rmse_delta_vs_current")
          assert "hardware-free" in profile_sweep["full_frame_image_delta_caveat"], profile_sweep
          assert isinstance(profile_sweep["candidate_ranking"], list), profile_sweep
          assert len(profile_sweep["candidate_ranking"]) == profile_sweep["candidate_count"], profile_sweep
          assert isinstance(profile_sweep["remaining_tuning_prompts"], list), profile_sweep
          profile_sweep_paths = profile_sweep["artifact_paths"]
          for key in (
              "summary_json",
              "candidate_montage_jpg",
              "current_overlay_jpg",
              "current_absolute_difference_jpg",
              "current_side_by_side_jpg",
              "best_overlay_jpg",
              "best_absolute_difference_jpg",
              "best_side_by_side_jpg",
          ):
              assert isinstance(profile_sweep_paths.get(key), str) and Path(profile_sweep_paths[key]).is_file(), (
                  key,
                  profile_sweep_paths,
              )
          assert isinstance(profile_sweep_paths.get("candidate_dir"), str) and Path(profile_sweep_paths["candidate_dir"]).is_dir(), profile_sweep_paths
          best_ranking_row = profile_sweep["candidate_ranking"][0]
          assert best_ranking_row["candidate_id"] == profile_sweep["best_candidate_id"], (
              best_ranking_row,
              profile_sweep["best_candidate_id"],
          )
          assert "frame_path" in best_ranking_row["artifact_paths"], best_ranking_row
          assert Path(best_ranking_row["artifact_paths"]["frame_path"]).is_file(), best_ranking_row
          assert Path(best_ranking_row["artifact_paths"]["annotated_path"]).is_file(), best_ranking_row
          profile_sweep_child = summary["child_commands"]["sim_camera_profile_sweep"]
          assert profile_sweep_child["ok"] is True, profile_sweep_child
          assert profile_sweep_child["summary_status"] == "ok", profile_sweep_child
          assert profile_sweep_child["diagnostics"]["candidate_count"] == profile_sweep["candidate_count"], profile_sweep_child
          assert profile_sweep_child["diagnostics"]["best_candidate_id"] == profile_sweep["best_candidate_id"], profile_sweep_child
          before_after = summary["simcamera_tuning_before_after"]
          assert before_after["ok"] is True, before_after
          assert before_after["status"] == "ok", before_after
          assert before_after["profile_name"] == "current_gripper_reference", before_after
          assert before_after["baseline_gripper_finger_width_px"] == 72, before_after
          assert before_after["current_gripper_finger_width_px"] == profile_sweep["current_gripper_finger_width_px"], before_after
          assert before_after["marker_time_seconds"] == 0.0, before_after
          assert isinstance(before_after["baseline_candidate_count"], int) and before_after["baseline_candidate_count"] > 0, before_after
          assert isinstance(before_after["current_candidate_count"], int) and before_after["current_candidate_count"] > 0, before_after
          assert_json_number(before_after["baseline_current_mean_abs_delta"], "before_after.baseline_current_mean_abs_delta")
          assert_json_number(before_after["baseline_current_rmse"], "before_after.baseline_current_rmse")
          assert_json_number(before_after["current_profile_mean_abs_delta"], "before_after.current_profile_mean_abs_delta")
          assert_json_number(before_after["current_profile_rmse"], "before_after.current_profile_rmse")
          assert_json_number(before_after["current_vs_baseline_mean_abs_delta"], "before_after.current_vs_baseline_mean_abs_delta")
          assert_json_number(before_after["current_vs_baseline_rmse"], "before_after.current_vs_baseline_rmse")
          assert_json_number(before_after["best_vs_baseline_best_mean_abs_delta"], "before_after.best_vs_baseline_best_mean_abs_delta")
          assert_json_number(before_after["best_vs_baseline_best_rmse"], "before_after.best_vs_baseline_best_rmse")
          assert isinstance(before_after["remaining_tuning_prompt_count"], int), before_after
          assert isinstance(before_after["remaining_tuning_prompts"], list), before_after
          assert before_after["media_assets_copied_into_repo"] is False, before_after
          assert before_after["missing_real_depth_reference"] is True, before_after
          assert before_after["missing_pick_place_video"] is True, before_after
          assert "hardware-free" in before_after["full_frame_image_delta_caveat"], before_after
          before_after_paths = before_after["artifact_paths"]
          for key in ("summary_json", "csv_rows", "readme_md"):
              assert isinstance(before_after_paths.get(key), str) and Path(before_after_paths[key]).is_file(), (
                  key,
                  before_after_paths,
              )
          for key in ("baseline_profile_sweep_dir", "current_profile_sweep_dir"):
              assert isinstance(before_after_paths.get(key), str) and Path(before_after_paths[key]).is_dir(), (
                  key,
                  before_after_paths,
              )
          sweep_artifact_paths = before_after_paths["sweeps"]
          for role in ("baseline", "current"):
              role_paths = sweep_artifact_paths[role]
              for key in (
                  "summary_path",
                  "candidate_montage_path",
                  "current_overlay_path",
                  "current_absolute_difference_path",
                  "current_side_by_side_path",
                  "best_overlay_path",
                  "best_absolute_difference_path",
                  "best_side_by_side_path",
              ):
                  assert isinstance(role_paths.get(key), str) and Path(role_paths[key]).is_file(), (
                      role,
                      key,
                      role_paths,
                  )
              assert isinstance(role_paths.get("candidate_dir"), str) and Path(role_paths["candidate_dir"]).is_dir(), (
                  role,
                  role_paths,
              )
          before_after_child = summary["child_commands"]["simcamera_tuning_before_after"]
          assert before_after_child["ok"] is True, before_after_child
          assert before_after_child["summary_status"] == "ok", before_after_child
          assert before_after_child["diagnostics"]["baseline_gripper_finger_width_px"] == 72, before_after_child
          assert before_after_child["diagnostics"]["media_assets_copied_into_repo"] is False, before_after_child
          reference_capture_manifest = summary["reference_capture_manifest"]
          assert reference_capture_manifest["ok"] is True, reference_capture_manifest
          assert reference_capture_manifest["status"] in {
              "reference_capture_manifest_not_supplied",
              "reference_capture_manifest_unavailable",
              "reference_capture_manifest_needs_follow_up",
              "reference_capture_manifest_ready",
          }, reference_capture_manifest
          if os.environ["REFERENCE_CAPTURE_MANIFEST"].strip():
              assert reference_capture_manifest["manifest_path"], reference_capture_manifest
          else:
              assert reference_capture_manifest["status"] == "reference_capture_manifest_not_supplied", reference_capture_manifest
              assert "reference_capture_manifest_not_supplied" in reference_capture_manifest["diagnostics"], reference_capture_manifest
          assert reference_capture_manifest["ready_for_calibration_grade_simcamera_tuning"] in {True, False}, reference_capture_manifest
          assert isinstance(reference_capture_manifest["depth_reference_capture_count"], int), reference_capture_manifest
          assert isinstance(reference_capture_manifest["pick_place_video_capture_count"], int), reference_capture_manifest
          assert isinstance(reference_capture_manifest["path_check_count"], int), reference_capture_manifest
          assert isinstance(reference_capture_manifest["missing_path_count"], int), reference_capture_manifest
          assert reference_capture_manifest["media_assets_copied_into_repo"] is False, reference_capture_manifest
          assert "missing_depth_reference" in reference_capture_manifest["diagnostics"] or reference_capture_manifest["ready_for_calibration_grade_simcamera_tuning"] is True, reference_capture_manifest
          assert "missing_pick_place_video" in reference_capture_manifest["diagnostics"] or reference_capture_manifest["ready_for_calibration_grade_simcamera_tuning"] is True, reference_capture_manifest
          reference_capture_manifest_artifacts = reference_capture_manifest["artifact_paths"]
          for key in ("summary_json", "csv", "readme_md"):
              assert isinstance(reference_capture_manifest_artifacts.get(key), str) and Path(reference_capture_manifest_artifacts[key]).is_file(), (
                  key,
                  reference_capture_manifest_artifacts,
              )
          manifest_child = summary["child_commands"]["reference_capture_manifest"]
          assert manifest_child["ok"] is True, manifest_child
          assert manifest_child["summary_status"] == reference_capture_manifest["status"], manifest_child
          assert manifest_child["diagnostics"]["missing_path_count"] == reference_capture_manifest["missing_path_count"], manifest_child
          assert manifest_child["diagnostics"]["media_assets_copied_into_repo"] is False, manifest_child
          assert summary["perception_fixture"]["status"] == "ok", summary["perception_fixture"]
          assert summary["perception_fixture"]["artifact_paths"], summary["perception_fixture"]
          pose_fixture = summary["sim_camera_pose_fixture"]
          assert pose_fixture["ok"] is True, pose_fixture
          assert pose_fixture["status"] == "ok", pose_fixture
          assert pose_fixture["case_count"] >= 2, pose_fixture
          assert "nominal_gripper_open_e4" in pose_fixture["case_ids"], pose_fixture["case_ids"]
          assert "perturbed_board_pose_open_e4" in pose_fixture["case_ids"], pose_fixture["case_ids"]
          assert pose_fixture["frame_paths"], pose_fixture
          assert pose_fixture["annotated_frame_paths"], pose_fixture
          assert pose_fixture["metadata_paths"], pose_fixture
          for case_id in pose_fixture["case_ids"]:
              assert Path(pose_fixture["frame_paths"][case_id]).is_file(), (case_id, pose_fixture)
              assert Path(pose_fixture["annotated_frame_paths"][case_id]).is_file(), (case_id, pose_fixture)
              assert Path(pose_fixture["metadata_paths"][case_id]).is_file(), (case_id, pose_fixture)
          assert pose_fixture["hardware_skipped"] is True, pose_fixture
          assert pose_fixture["gui_skipped"] is True, pose_fixture
          bundle_manifest = summary["so101_model_bundle_manifest"]
          assert bundle_manifest["ok"] is True, bundle_manifest
          assert bundle_manifest["status"] in {
              "model_bundle_manifest_not_supplied",
              "model_bundle_manifest_unavailable",
              "model_bundle_manifest_parse_error",
              "model_bundle_manifest_schema_error",
              "model_bundle_manifest_needs_follow_up",
              "model_bundle_manifest_ready_for_model_backed_ik",
          }, bundle_manifest
          assert bundle_manifest["ready_for_model_backed_ik"] in {True, False}, bundle_manifest
          assert bundle_manifest["model_authority"] in {
              "reviewed_bundle_required",
              "incomplete_hardware_free_regression_fixture_not_physical_so101_authority",
              "hardware_free_regression_fixture_not_physical_so101_authority",
              "reviewed_so101_model_bundle_manifest",
          }, bundle_manifest
          assert bundle_manifest["physical_so101_model_authority_ready"] in {True, False}, bundle_manifest
          assert bundle_manifest["hardware_free_regression_fixture_ready"] in {True, False}, bundle_manifest
          assert bundle_manifest["physical_authority_gate_status"] in {
              "physical_reviewed_authority_ready",
              "hardware_free_fixture_ready_not_physical_authority",
              "physical_reviewed_authority_blocked",
          }, bundle_manifest
          assert isinstance(bundle_manifest["physical_authority_blockers"], list), bundle_manifest
          assert all(isinstance(blocker, str) and blocker for blocker in bundle_manifest["physical_authority_blockers"]), bundle_manifest
          if bundle_manifest["physical_so101_model_authority_ready"] is True:
              assert bundle_manifest["physical_authority_gate_status"] == "physical_reviewed_authority_ready", bundle_manifest
              assert bundle_manifest["physical_authority_blockers"] == [], bundle_manifest
          else:
              assert bundle_manifest["physical_authority_gate_status"] != "physical_reviewed_authority_ready", bundle_manifest
              assert bundle_manifest["physical_authority_blockers"], bundle_manifest
          if bundle_manifest["hardware_free_regression_fixture_ready"] is True:
              assert bundle_manifest["physical_authority_gate_status"] == "hardware_free_fixture_ready_not_physical_authority", bundle_manifest
              assert any(
                  blocker.startswith("synthetic_fixture_authority_not_physical_so101:")
                  for blocker in bundle_manifest["physical_authority_blockers"]
              ), bundle_manifest
          assert isinstance(bundle_manifest["synthetic_fixture_authority_fields"], list), bundle_manifest
          assert isinstance(bundle_manifest["next_required_for_goal"], list), bundle_manifest
          for index, action in enumerate(bundle_manifest["next_required_for_goal"], start=1):
              assert action["priority"] == index, action
              assert isinstance(action.get("missing_input"), str) and action["missing_input"], action
