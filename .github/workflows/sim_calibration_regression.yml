name: Simulator Calibration Regression

on:
  workflow_dispatch:

  pull_request:
    branches:
      - feat/telemetry-recording
    paths:
      - "archive/chess_test_images/current_view.jpg"
      - "docs/sim_calibration_regression.md"
      - "llm-tools/**"
      - "README.md"
      - "scripts/render_sim_*.py"
      - "scripts/smoke_sim_*.py"
      - "skills/**"
      - "src/lerobot/cameras/**"
      - "src/lerobot/configs/chessboard.py"
      - "src/lerobot/perception/chess/**"
      - "src/lerobot/sim/**"
      - "src/lerobot/utils/geometry.py"
      - ".github/workflows/sim_calibration_regression.yml"

  push:
    branches:
      - feat/telemetry-recording
    paths:
      - "archive/chess_test_images/current_view.jpg"
      - "docs/sim_calibration_regression.md"
      - "llm-tools/**"
      - "README.md"
      - "scripts/render_sim_*.py"
      - "scripts/smoke_sim_*.py"
      - "skills/**"
      - "src/lerobot/cameras/**"
      - "src/lerobot/configs/chessboard.py"
      - "src/lerobot/perception/chess/**"
      - "src/lerobot/sim/**"
      - "src/lerobot/utils/geometry.py"
      - ".github/workflows/sim_calibration_regression.yml"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  CALIBRATION_REGRESSION_OUTPUT_DIR: "/tmp/lerobot_sim/calibration_regression_suite"
  CALIBRATION_REGRESSION_ARTIFACT_NAME: "sim-calibration-regression-${{ github.run_id }}"
  IK_MODEL_PATH: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  sim-calibration-regression:
    name: Hardware-free calibration gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install suite dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            deepdiff \
            draccus \
            huggingface-hub \
            numpy \
            opencv-python-headless \
            pyserial \
            "torch>=2.2.1,<2.8.0" \
            tqdm

      - name: Run simulator calibration regression suite
        run: |
          cmd=(
            python
            scripts/smoke_sim_calibration_regression_suite.py
            --output-dir "${CALIBRATION_REGRESSION_OUTPUT_DIR}"
            --python "$(python -c 'import sys; print(sys.executable)')"
            --include-negative-check
          )
          if [ -n "${IK_MODEL_PATH}" ]; then
            cmd+=(--ik-model-path "${IK_MODEL_PATH}")
          fi
          "${cmd[@]}"

      - name: Check regression summary
        run: |
          python - <<'PY'
          import json
          import os
          from numbers import Real
          from pathlib import Path

          summary_path = Path(os.environ["CALIBRATION_REGRESSION_OUTPUT_DIR"]) / "calibration_regression_summary.json"
          summary = json.loads(summary_path.read_text())

          def assert_json_number(value, label):
              assert isinstance(value, Real) and not isinstance(value, bool), (label, value)

          assert summary["ok"] is True, summary["aggregate_status"]
          assert summary["status"] == "ok", summary["status"]
          assert summary["hardware_skipped"] is True
          assert summary["gui_skipped"] is True
          assert summary["selected_candidate"]["candidate_id"], summary["selected_candidate"]
          assert summary["comparison_set"]["status"] == "ok", summary["comparison_set"]
          assert summary["comparison_set"]["artifacts"], summary["comparison_set"]
          assert summary["perception_fixture"]["status"] == "ok", summary["perception_fixture"]
          assert summary["perception_fixture"]["artifact_paths"], summary["perception_fixture"]
          pose_fixture = summary["sim_camera_pose_fixture"]
          assert pose_fixture["ok"] is True, pose_fixture
          assert pose_fixture["status"] == "ok", pose_fixture
          assert pose_fixture["case_count"] >= 2, pose_fixture
          assert "nominal_gripper_open_e4" in pose_fixture["case_ids"], pose_fixture["case_ids"]
          assert "perturbed_board_pose_open_e4" in pose_fixture["case_ids"], pose_fixture["case_ids"]
          assert pose_fixture["frame_paths"], pose_fixture
          assert pose_fixture["annotated_frame_paths"], pose_fixture
          assert pose_fixture["metadata_paths"], pose_fixture
          for case_id in pose_fixture["case_ids"]:
              assert Path(pose_fixture["frame_paths"][case_id]).is_file(), (case_id, pose_fixture)
              assert Path(pose_fixture["annotated_frame_paths"][case_id]).is_file(), (case_id, pose_fixture)
              assert Path(pose_fixture["metadata_paths"][case_id]).is_file(), (case_id, pose_fixture)
          assert pose_fixture["hardware_skipped"] is True, pose_fixture
          assert pose_fixture["gui_skipped"] is True, pose_fixture
          source_inventory = summary["so101_model_source_inventory"]
          assert source_inventory["ok"] is True, source_inventory
          assert source_inventory["status"] in {
              "missing_authoritative_model",
              "authoritative_model_found",
          }, source_inventory
          assert isinstance(source_inventory["candidate_count"], int), source_inventory
          assert isinstance(source_inventory["likely_candidate_count"], int), source_inventory
          assert isinstance(source_inventory["direct_contract_candidate_count"], int), source_inventory
          assert isinstance(source_inventory["authoritative_candidate_count"], int), source_inventory
          assert source_inventory["candidate_count"] >= source_inventory["likely_candidate_count"], source_inventory
          assert source_inventory["likely_candidate_count"] >= source_inventory["direct_contract_candidate_count"], source_inventory
          if source_inventory["status"] == "missing_authoritative_model":
              assert source_inventory["authoritative_candidate_count"] == 0, source_inventory
              assert source_inventory["diagnostics"], source_inventory
          source_inventory_artifacts = source_inventory["artifacts"]
          for key in ("summary_json", "candidates_csv", "readme_md"):
              assert isinstance(source_inventory_artifacts.get(key), str) and Path(source_inventory_artifacts[key]).is_file(), (
                  key,
                  source_inventory_artifacts,
              )
          so101_contract = summary["so101_model_contract"]
          assert so101_contract["ok"] is True, so101_contract
          assert so101_contract["status"] in {
              "missing_model",
              "model_unavailable",
              "model_contract_checked",
              "model_contract_needs_follow_up",
              "model_suffix_supported_not_directly_usable",
          }, so101_contract
          assert so101_contract["model_request_status"] in {
              "model_not_supplied",
              "model_unavailable",
              "model_supplied",
              "unsupported_suffix",
          }, so101_contract
          assert so101_contract["robot_kinematics_status"] in {
              "missing_model",
              "model_unavailable",
              "supported_suffix_not_directly_usable",
              "urdf_requires_placo",
              "directly_usable",
          }, so101_contract
          assert so101_contract["target_frame"] == "gripper_frame_link", so101_contract
          so101_artifacts = so101_contract["artifacts"]
          for key in ("summary_json", "checklist_csv", "readme_md"):
              assert isinstance(so101_artifacts.get(key), str) and Path(so101_artifacts[key]).is_file(), (
                  key,
                  so101_artifacts,
              )
          ik_reachability = summary["ik_reachability_drill"]
          assert ik_reachability["ok"] is True, ik_reachability
          assert ik_reachability["status"] in {"ok_model_backed", "model_unavailable_fallback_complete"}, ik_reachability
          assert isinstance(ik_reachability["row_count"], int) and ik_reachability["row_count"] > 0, ik_reachability
          assert isinstance(ik_reachability["counts_by_feasibility"], dict) and ik_reachability["counts_by_feasibility"], ik_reachability
          ik_artifacts = ik_reachability["artifacts"]
          for key in ("summary_json", "rows_csv", "heatmap_png"):
              assert isinstance(ik_artifacts.get(key), str) and Path(ik_artifacts[key]).is_file(), (key, ik_artifacts)
          model_diagnostic = ik_reachability["model_diagnostic"]
          assert model_diagnostic["status"] in {
              "model_candidate_found",
              "missing_model",
              "model_unavailable",
          }, model_diagnostic
          matrix = summary["pick_place_scenario_matrix"]
          assert matrix["ok"] is True, matrix
          assert matrix["aggregate_status"]["ok"] is True, matrix["aggregate_status"]
          assert matrix["scenario_count"] == 4, matrix["scenario_count"]
          assert matrix["scenario_ids"] == [
              "center_to_center",
              "left_edge_file",
              "back_rank",
              "near_gripper_lower_board",
          ], matrix["scenario_ids"]
          assert matrix["release_frame_paths"], matrix
          expected_scenario_ids = matrix["scenario_ids"]
          for scenario_id in expected_scenario_ids:
              release_path = matrix["release_frame_paths"].get(scenario_id)
              assert isinstance(release_path, str) and Path(release_path).is_file(), (
                  scenario_id,
                  release_path,
              )

          visibility = matrix["piece_visibility"]
          assert visibility["all_scenarios_available"] is True, visibility
          assert visibility["available_scenario_count"] == 4, visibility
          assert visibility["scenario_count"] == 4, visibility
          visibility_rows = {
              row["scenario_id"]: row
              for row in visibility["scenarios"]
              if isinstance(row, dict) and isinstance(row.get("scenario_id"), str)
          }
          assert list(visibility_rows) == expected_scenario_ids, visibility_rows

          visibility_by_scenario = matrix["piece_visibility_by_scenario"]
          assert list(visibility_by_scenario) == expected_scenario_ids, visibility_by_scenario
          for scenario_id in expected_scenario_ids:
              row = visibility_rows[scenario_id]
              assert row["available"] is True, row
              release = row["target_release_open"]
              assert isinstance(release, dict), row
              assert release["label"] == "target_release_open", release
              assert release["path"] == matrix["release_frame_paths"][scenario_id], release
              assert_json_number(release["visible_fraction"], f"{scenario_id}.visible_fraction")
              assert_json_number(release["occlusion_fraction"], f"{scenario_id}.occlusion_fraction")
              assert "min_clearance_px" in release, release
              assert "clear_of_gripper" in release, release

              scenario_release = visibility_by_scenario[scenario_id]["target_release_open"]
              assert scenario_release == release, (scenario_id, scenario_release, release)

          assert summary["negative_check"]["status"] == "no_reference_media_selected", summary["negative_check"]

          artifact_index_summary = summary["artifact_index"]
          artifact_index_path = Path(artifact_index_summary["path"])
          assert artifact_index_summary["status"] == "ok", artifact_index_summary
          assert isinstance(artifact_index_summary["artifact_count"], int), artifact_index_summary
          assert not isinstance(artifact_index_summary["artifact_count"], bool), artifact_index_summary
          assert artifact_index_summary["artifact_count"] > 0, artifact_index_summary
          assert artifact_index_summary["missing_artifact_count"] == 0, artifact_index_summary
          assert artifact_index_path.is_file(), artifact_index_summary

          artifact_index = json.loads(artifact_index_path.read_text())
          assert artifact_index["ok"] is True, artifact_index
          assert artifact_index["status"] == "ok", artifact_index["status"]
          assert artifact_index["artifact_index_path"] == str(artifact_index_path), artifact_index
          assert artifact_index["suite_summary_path"] == str(summary_path), artifact_index
          assert artifact_index["missing_artifacts"] == [], artifact_index["missing_artifacts"]
          artifacts = artifact_index["artifacts"]
          assert isinstance(artifacts, list) and artifacts, artifact_index
          assert len(artifacts) == artifact_index_summary["artifact_count"], (
              len(artifacts),
              artifact_index_summary,
          )

          required_artifact_categories = {
              "real_reference_comparison",
              "ranked_candidate",
              "perception_fixture",
              "sim_camera_pose_fixture",
              "so101_model_source_inventory",
              "so101_model_contract",
              "ik_reachability",
              "pick_place_scenario",
              "negative_check",
              "logs",
          }
          summary_category_rows = {
              row["category"]: row
              for row in artifact_index_summary["categories"]
              if isinstance(row, dict) and isinstance(row.get("category"), str)
          }
          index_category_rows = {
              row["category"]: row
              for row in artifact_index["categories"]
              if isinstance(row, dict) and isinstance(row.get("category"), str)
          }
          assert required_artifact_categories <= set(summary_category_rows), summary_category_rows
          assert required_artifact_categories <= set(index_category_rows), index_category_rows
          for category in required_artifact_categories:
              for row in (summary_category_rows[category], index_category_rows[category]):
                  assert isinstance(row["artifact_count"], int) and row["artifact_count"] > 0, row
                  assert row["missing_count"] == 0, row

          artifacts_by_category = {
              category: [
                  row
                  for row in artifacts
                  if isinstance(row, dict) and row.get("category") == category
              ]
              for category in required_artifact_categories
          }
          assert any(
              row.get("kind") == "image" and row.get("exists") is True
              for row in artifacts_by_category["real_reference_comparison"]
          ), artifacts_by_category["real_reference_comparison"]
          assert any(
              row.get("exists") is True and row.get("candidate_id")
              for row in artifacts_by_category["ranked_candidate"]
          ), artifacts_by_category["ranked_candidate"]
          assert any(
              row.get("exists") is True and row.get("kind") in {"json", "image"}
              for row in artifacts_by_category["perception_fixture"]
          ), artifacts_by_category["perception_fixture"]
          assert any(
              row.get("kind") == "image"
              and row.get("exists") is True
              and row.get("scenario_id") == "nominal_gripper_open_e4"
              for row in artifacts_by_category["sim_camera_pose_fixture"]
          ), artifacts_by_category["sim_camera_pose_fixture"]
          assert any(
              row.get("kind") == "json"
              and row.get("exists") is True
              and row.get("metrics", {}).get("status") in {
                  "missing_authoritative_model",
                  "authoritative_model_found",
              }
              for row in artifacts_by_category["so101_model_source_inventory"]
          ), artifacts_by_category["so101_model_source_inventory"]
          assert any(
              row.get("kind") == "csv" and row.get("exists") is True
              for row in artifacts_by_category["so101_model_source_inventory"]
          ), artifacts_by_category["so101_model_source_inventory"]
          assert any(
              row.get("label") == "so101_model_source_inventory:readme" and row.get("exists") is True
              for row in artifacts_by_category["so101_model_source_inventory"]
          ), artifacts_by_category["so101_model_source_inventory"]
          assert any(
              row.get("kind") == "json"
              and row.get("exists") is True
              and row.get("scenario_id") == "perturbed_board_pose_open_e4"
              for row in artifacts_by_category["sim_camera_pose_fixture"]
          ), artifacts_by_category["sim_camera_pose_fixture"]
          assert any(
              row.get("kind") == "json"
              and row.get("exists") is True
              and row.get("metrics", {}).get("status") in {"ok_model_backed", "model_unavailable_fallback_complete"}
              for row in artifacts_by_category["ik_reachability"]
          ), artifacts_by_category["ik_reachability"]
          assert any(
              row.get("kind") == "json"
              and row.get("exists") is True
              and row.get("metrics", {}).get("model_request_status") in {
                  "model_not_supplied",
                  "model_unavailable",
                  "model_supplied",
                  "unsupported_suffix",
              }
              for row in artifacts_by_category["so101_model_contract"]
          ), artifacts_by_category["so101_model_contract"]
          assert any(
              row.get("kind") == "csv" and row.get("exists") is True
              for row in artifacts_by_category["so101_model_contract"]
          ), artifacts_by_category["so101_model_contract"]
          assert any(
              row.get("label") == "so101_model_contract:readme" and row.get("exists") is True
              for row in artifacts_by_category["so101_model_contract"]
          ), artifacts_by_category["so101_model_contract"]
          assert any(
              row.get("kind") == "csv" and row.get("exists") is True
              for row in artifacts_by_category["ik_reachability"]
          ), artifacts_by_category["ik_reachability"]
          assert any(
              row.get("kind") == "image" and row.get("exists") is True
              for row in artifacts_by_category["ik_reachability"]
          ), artifacts_by_category["ik_reachability"]
          indexed_release_scenarios = {
              row.get("scenario_id")
              for row in artifacts_by_category["pick_place_scenario"]
              if row.get("kind") == "image" and row.get("exists") is True
          }
          assert set(expected_scenario_ids) <= indexed_release_scenarios, (
              expected_scenario_ids,
              indexed_release_scenarios,
          )
          for scenario_id in expected_scenario_ids:
              assert any(
                  row.get("scenario_id") == scenario_id
                  and row.get("path") == matrix["release_frame_paths"][scenario_id]
                  and row.get("exists") is True
                  for row in artifacts_by_category["pick_place_scenario"]
              ), (scenario_id, artifacts_by_category["pick_place_scenario"])
          assert any(
              row.get("exists") is True
              and isinstance(row.get("metrics"), dict)
              and row["metrics"].get("status") == "no_reference_media_selected"
              for row in artifacts_by_category["negative_check"]
          ), artifacts_by_category["negative_check"]
          assert any(
              row.get("label") == "suite:summary" and row.get("path") == str(summary_path)
              for row in artifacts_by_category["logs"]
          ), artifacts_by_category["logs"]

          report_path = summary_path.parent / "artifact_index_report.md"
          entrypoint_path = summary_path.parent / "README.md"
          assert report_path.is_file(), report_path
          assert entrypoint_path.is_file(), entrypoint_path
          report_text = report_path.read_text()
          assert "### SO-101 Model Source Inventory" in report_text, report_text
          entrypoint_text = entrypoint_path.read_text()
          assert "Open `artifact_index_report.md` first." in entrypoint_text, entrypoint_text
          assert "`calibration_regression_summary.json`" in entrypoint_text, entrypoint_text
          assert "`artifact_index.json`" in entrypoint_text, entrypoint_text
          assert "`so101_model_source_inventory/so101_model_source_inventory_summary.json`" in entrypoint_text, entrypoint_text
          assert "`so101_model_source_inventory/so101_model_source_candidates.csv`" in entrypoint_text, entrypoint_text
          assert "`hardware_skipped: true`" in entrypoint_text, entrypoint_text
          assert "`gui_skipped: true`" in entrypoint_text, entrypoint_text
          assert "Real-media gap:" in entrypoint_text, entrypoint_text
          assert "No real-world videos are present for motion, recovery, or timing references." in entrypoint_text, entrypoint_text
          assert "No reference media currently documents failure modes." in entrypoint_text, entrypoint_text

          print(
              json.dumps(
                  {
                      "summary_path": str(summary_path),
                      "artifact_entrypoint": str(entrypoint_path),
                      "artifact_index_report": str(report_path),
                      "selected_candidate": summary["selected_candidate"]["candidate_id"],
                      "hardware_skipped": summary["hardware_skipped"],
                      "gui_skipped": summary["gui_skipped"],
                      "pick_place_scenario_matrix": {
                          "summary_path": matrix["summary_path"],
                          "scenario_ids": matrix["scenario_ids"],
                          "release_frame_paths": matrix["release_frame_paths"],
                          "piece_visibility": matrix["piece_visibility"],
                      },
                      "sim_camera_pose_fixture": {
                          "summary_path": pose_fixture["summary_path"],
                          "case_ids": pose_fixture["case_ids"],
                          "frame_paths": pose_fixture["frame_paths"],
                      },
                      "so101_model_source_inventory": {
                          "summary_path": source_inventory["summary_path"],
                          "status": source_inventory["status"],
                          "candidate_count": source_inventory["candidate_count"],
                          "authoritative_candidate_count": source_inventory["authoritative_candidate_count"],
                          "recommended_contract_check_path": source_inventory["recommended_contract_check_path"],
                          "artifacts": source_inventory_artifacts,
                      },
                      "so101_model_contract": {
                          "summary_path": so101_contract["summary_path"],
                          "status": so101_contract["status"],
                          "model_request_status": so101_contract["model_request_status"],
                          "robot_kinematics_status": so101_contract["robot_kinematics_status"],
                          "artifacts": so101_artifacts,
                      },
                      "ik_reachability_drill": {
                          "summary_path": ik_reachability["summary_path"],
                          "row_count": ik_reachability["row_count"],
                          "counts_by_feasibility": ik_reachability["counts_by_feasibility"],
                          "artifacts": ik_artifacts,
                          "model_diagnostic": model_diagnostic,
                      },
                      "negative_check": summary["negative_check"]["status"],
                      "artifact_index": {
                          "path": str(artifact_index_path),
                          "status": artifact_index_summary["status"],
                          "artifact_count": artifact_index_summary["artifact_count"],
                          "missing_artifact_count": artifact_index_summary["missing_artifact_count"],
                          "categories": artifact_index_summary["categories"],
                      },
                  },
                  indent=2,
              )
          )
          PY

      - name: Write artifact review summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output_dir = Path(os.environ["CALIBRATION_REGRESSION_OUTPUT_DIR"])
          artifact_name = os.environ["CALIBRATION_REGRESSION_ARTIFACT_NAME"]
          summary_path = output_dir / "calibration_regression_summary.json"
          summary = json.loads(summary_path.read_text())

          core_json_paths = [
              "calibration_regression_summary.json",
              "artifact_index.json",
              "inventory/reference_media_inventory.json",
              "comparison_set/comparison_set_summary.json",
              "session/session_summary.json",
              "fixture/fixture_summary.json",
              "sim_camera_pose_fixture/sim_camera_pose_fixture_summary.json",
              "so101_model_source_inventory/so101_model_source_inventory_summary.json",
              "so101_model_contract/so101_model_contract_summary.json",
              "ik_reachability_drill/ik_reachability_drill_summary.json",
              "pick_place_scenario_matrix/scenario_matrix_summary.json",
              "negative_empty_inventory/comparison_set_summary.json",
          ]
          for relative_path in ["README.md", "artifact_index_report.md", *core_json_paths]:
              assert (output_dir / relative_path).is_file(), relative_path

          def markdown_bool(value):
              if isinstance(value, bool):
                  return str(value).lower()
              return str(value)

          lines = [
              "## Simulator Calibration Regression Artifacts",
              "",
              f"Download `{artifact_name}` and open `artifact_index_report.md` first.",
              "`README.md` at the artifact root repeats the entrypoint and review markers.",
              "",
              "Core JSON summaries:",
              *[f"- `{path}`" for path in core_json_paths],
              "",
              "Review markers:",
              f"- `hardware_skipped`: `{markdown_bool(summary['hardware_skipped'])}`",
              f"- `gui_skipped`: `{markdown_bool(summary['gui_skipped'])}`",
              f"- `negative_check`: `{summary['negative_check']['status']}`",
              "- Real-media gap: no real-world videos or failure-mode reference media are present.",
              "",
          ]
          rendered = "\n".join(lines) + "\n"
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as step_summary:
              step_summary.write(rendered)
          print(rendered)
          PY

      - name: Upload calibration regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CALIBRATION_REGRESSION_ARTIFACT_NAME }}
          path: ${{ env.CALIBRATION_REGRESSION_OUTPUT_DIR }}
          if-no-files-found: warn
