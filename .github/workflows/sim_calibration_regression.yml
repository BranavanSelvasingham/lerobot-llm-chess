      - name: Upload calibration regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CALIBRATION_REGRESSION_ARTIFACT_NAME }}
          path: |
            ${{ env.CALIBRATION_REGRESSION_OUTPUT_DIR }}
            ${{ env.SO101_SOURCE_AUTHORITY_MATRIX_OUTPUT_DIR }}
            ${{ env.SO101_REVIEWED_AUTHORITY_GATE_MATRIX_OUTPUT_DIR }}
            ${{ env.SO101_REVIEWED_MUJOCO_BUNDLE_MATRIX_OUTPUT_DIR }}
            ${{ env.SO101_MUJOCO_SCENE_MATRIX_OUTPUT_DIR }}
            ${{ env.SO101_CHESS_ENV_MATRIX_OUTPUT_DIR }}
            ${{ env.SO101_BOARD_PICK_PROBE_MATRIX_OUTPUT_DIR }}
            ${{ env.SO101_TRAINING_ROLLOUTS_MATRIX_OUTPUT_DIR }}
            ${{ env.SO101_TRAINING_READINESS_GATE_MATRIX_OUTPUT_DIR }}
          if-no-files-found: warn
