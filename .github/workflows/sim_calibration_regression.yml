name: Simulator Calibration Regression

on:
  workflow_dispatch:

  pull_request:
    branches:
      - feat/telemetry-recording
    paths:
      - "archive/chess_test_images/current_view.jpg"
      - "docs/sim_calibration_regression.md"
      - "docs/sim_reference_capture_manifest.md"
      - "docs/sim_reference_media_inventory.md"
      - "docs/sim_so101_chess_env.md"
      - "docs/sim_so101_env_resets.md"
      - "docs/sim_so101_model_asset_preflight.md"
      - "docs/sim_so101_model_bundle_manifest.md"
      - "docs/sim_so101_model_contract.md"
      - "docs/sim_so101_model_source_inventory.md"
      - "docs/sim_so101_reviewed_mujoco_bundle.md"
      - "docs/sim_so101_mujoco_board_pick_probe.md"
      - "docs/sim_so101_mujoco_contact_probe.md"
      - "docs/sim_so101_mujoco_grasp_probe.md"
      - "docs/sim_so101_mujoco_scene.md"
      - "docs/sim_so101_training_rollouts.md"
      - "llm-tools/**"
      - "README.md"
      - "scripts/render_sim_*.py"
      - "scripts/smoke_sim_*.py"
      - "skills/**"
      - "src/lerobot/cameras/**"
      - "src/lerobot/configs/chessboard.py"
      - "src/lerobot/perception/chess/**"
      - "src/lerobot/sim/**"
      - "src/lerobot/utils/geometry.py"
      - ".github/workflows/sim_calibration_regression.yml"

  push:
    branches:
      - feat/telemetry-recording
    paths:
      - "archive/chess_test_images/current_view.jpg"
      - "docs/sim_calibration_regression.md"
      - "docs/sim_reference_capture_manifest.md"
      - "docs/sim_reference_media_inventory.md"
      - "docs/sim_so101_chess_env.md"
      - "docs/sim_so101_env_resets.md"
      - "docs/sim_so101_model_asset_preflight.md"
      - "docs/sim_so101_model_bundle_manifest.md"
      - "docs/sim_so101_model_contract.md"
      - "docs/sim_so101_model_source_inventory.md"
      - "docs/sim_so101_reviewed_mujoco_bundle.md"
      - "docs/sim_so101_mujoco_board_pick_probe.md"
      - "docs/sim_so101_mujoco_contact_probe.md"
      - "docs/sim_so101_mujoco_grasp_probe.md"
      - "docs/sim_so101_mujoco_scene.md"
      - "docs/sim_so101_training_rollouts.md"
      - "llm-tools/**"
      - "README.md"
      - "scripts/render_sim_*.py"
      - "scripts/smoke_sim_*.py"
      - "skills/**"
      - "src/lerobot/cameras/**"
      - "src/lerobot/configs/chessboard.py"
      - "src/lerobot/perception/chess/**"
      - "src/lerobot/sim/**"
      - "src/lerobot/utils/geometry.py"
      - ".github/workflows/sim_calibration_regression.yml"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  CALIBRATION_REGRESSION_OUTPUT_DIR: "/tmp/lerobot_sim/calibration_regression_suite"
  SO101_SOURCE_AUTHORITY_MATRIX_OUTPUT_DIR: "/tmp/lerobot_sim/so101_source_authority_matrix"
  SO101_MODEL_BUNDLE_PROBE_MATRIX_OUTPUT_DIR: "/tmp/lerobot_sim/so101_model_bundle_probe_matrix"
  SO101_MODEL_BUNDLE_MANIFEST_MATRIX_OUTPUT_DIR: "/tmp/lerobot_sim/so101_model_bundle_manifest_matrix"
  SO101_REVIEWED_AUTHORITY_GATE_MATRIX_OUTPUT_DIR: "/tmp/lerobot_sim/so101_reviewed_authority_gate_matrix"
  SO101_REVIEWED_MUJOCO_BUNDLE_MATRIX_OUTPUT_DIR: "/tmp/lerobot_sim/so101_reviewed_mujoco_bundle_matrix"
  SO101_MUJOCO_SCENE_MATRIX_OUTPUT_DIR: "/tmp/lerobot_sim/so101_mujoco_scene_matrix"
  SO101_CHESS_ENV_MATRIX_OUTPUT_DIR: "/tmp/lerobot_sim/so101_chess_env_matrix"
  SO101_BOARD_PICK_PROBE_MATRIX_OUTPUT_DIR: "/tmp/lerobot_sim/so101_mujoco_board_pick_probe_matrix"
  SO101_TRAINING_ROLLOUTS_MATRIX_OUTPUT_DIR: "/tmp/lerobot_sim/so101_training_rollouts_matrix"
  SO101_TRAINING_READINESS_GATE_MATRIX_OUTPUT_DIR: "/tmp/lerobot_sim/so101_training_readiness_gate_matrix"
  CALIBRATION_REGRESSION_ARTIFACT_NAME: "sim-calibration-regression-${{ github.run_id }}"
  REFERENCE_MEDIA_ROOTS: ""
  REFERENCE_CAPTURE_MANIFEST: ""
  IK_MODEL_PATH: ""
  IK_MODEL_ASSET_ROOTS: ""
  SO101_MODEL_BUNDLE_MANIFEST: ""
  SO101_MODEL_SOURCE_ROOTS: ""
  SO101_MODEL_SOURCE_EXTRA_ROOTS: ""
  SO101_AUTHORITATIVE_MODEL_PATHS: ""
  SO101_AUTHORITATIVE_MODEL_ROOTS: ""
  SO101_SOURCE_AUTHORITY_REVIEWED_BY: ""
  SO101_SOURCE_AUTHORITY_REVIEWED_AT: ""
  SO101_SOURCE_AUTHORITY_REVIEW_ID: ""
  SO101_SOURCE_AUTHORITY_REVIEW_URL: ""
  SO101_SOURCE_AUTHORITY_SOURCE_REFERENCE: ""
  SO101_SOURCE_AUTHORITY_REVIEW_SCOPES: ""
  SO101_SOURCE_AUTHORITY_LICENSE_BASIS: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  sim-calibration-regression:
    name: Hardware-free calibration gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install suite dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            deepdiff \
            draccus \
            gymnasium \
            huggingface-hub \
            mujoco \
            numpy \
            opencv-python-headless \
            pyserial \
            "torch>=2.2.1,<2.8.0" \
            tqdm

      - name: Run simulator calibration regression suite
        run: |
          append_repeatable_args() {
            local flag="$1"
            local values="$2"
            if [ -z "${values}" ]; then
              return 0
            fi
            while IFS= read -r value; do
              if [ -n "${value}" ]; then
                cmd+=("${flag}" "${value}")
              fi
            done <<< "${values}"
          }

          cmd=(
            python
            scripts/smoke_sim_calibration_regression_suite.py
            --output-dir "${CALIBRATION_REGRESSION_OUTPUT_DIR}"
            --python "$(python -c 'import sys; print(sys.executable)')"
            --include-negative-check
          )
          append_repeatable_args --reference-media-root "${REFERENCE_MEDIA_ROOTS}"
          if [ -n "${REFERENCE_CAPTURE_MANIFEST}" ]; then
            cmd+=(--reference-capture-manifest "${REFERENCE_CAPTURE_MANIFEST}")
          fi
          if [ -n "${IK_MODEL_PATH}" ]; then
            cmd+=(--ik-model-path "${IK_MODEL_PATH}")
          fi
          if [ -n "${SO101_MODEL_BUNDLE_MANIFEST}" ]; then
            cmd+=(--so101-model-bundle-manifest "${SO101_MODEL_BUNDLE_MANIFEST}")
          fi
          append_repeatable_args --ik-model-asset-root "${IK_MODEL_ASSET_ROOTS}"
          append_repeatable_args --so101-model-source-root "${SO101_MODEL_SOURCE_ROOTS}"
          append_repeatable_args --so101-model-source-extra-root "${SO101_MODEL_SOURCE_EXTRA_ROOTS}"
          append_repeatable_args --so101-authoritative-model-path "${SO101_AUTHORITATIVE_MODEL_PATHS}"
          append_repeatable_args --so101-authoritative-model-root "${SO101_AUTHORITATIVE_MODEL_ROOTS}"
          if [ -n "${SO101_SOURCE_AUTHORITY_REVIEWED_BY}" ]; then
            cmd+=(--so101-source-authority-reviewed-by "${SO101_SOURCE_AUTHORITY_REVIEWED_BY}")
          fi
          if [ -n "${SO101_SOURCE_AUTHORITY_REVIEWED_AT}" ]; then
            cmd+=(--so101-source-authority-reviewed-at "${SO101_SOURCE_AUTHORITY_REVIEWED_AT}")
          fi
          if [ -n "${SO101_SOURCE_AUTHORITY_REVIEW_ID}" ]; then
            cmd+=(--so101-source-authority-review-id "${SO101_SOURCE_AUTHORITY_REVIEW_ID}")
          fi
          if [ -n "${SO101_SOURCE_AUTHORITY_REVIEW_URL}" ]; then
            cmd+=(--so101-source-authority-review-url "${SO101_SOURCE_AUTHORITY_REVIEW_URL}")
          fi
          if [ -n "${SO101_SOURCE_AUTHORITY_SOURCE_REFERENCE}" ]; then
            cmd+=(--so101-source-authority-source-reference "${SO101_SOURCE_AUTHORITY_SOURCE_REFERENCE}")
          fi
          append_repeatable_args --so101-source-authority-review-scope "${SO101_SOURCE_AUTHORITY_REVIEW_SCOPES}"
          if [ -n "${SO101_SOURCE_AUTHORITY_LICENSE_BASIS}" ]; then
            cmd+=(--so101-source-authority-license-basis "${SO101_SOURCE_AUTHORITY_LICENSE_BASIS}")
          fi
          "${cmd[@]}"

      - name: Run SO-101 source authority matrix
        run: |
          python scripts/smoke_sim_so101_source_authority_matrix.py \
            --output-dir "${SO101_SOURCE_AUTHORITY_MATRIX_OUTPUT_DIR}" \
            --python "$(python -c 'import sys; print(sys.executable)')"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = Path(os.environ["SO101_SOURCE_AUTHORITY_MATRIX_OUTPUT_DIR"]) / "so101_source_authority_matrix_summary.json"
          summary = json.loads(summary_path.read_text())
          assert summary["ok"] is True, summary
          assert summary["status"] == "ok", summary
          assert summary["hardware_skipped"] is True, summary
          assert summary["gui_skipped"] is True, summary
          assert summary["openai_skipped"] is True, summary
          assert summary["case_ids"] == [
              "missing_source_root",
              "candidate_unverified",
              "candidate_prefer_top_level_model",
              "authoritative_missing_review_metadata",
              "authoritative_placeholder_review_metadata",
              "authoritative_angle_bracket_placeholder_review_metadata",
              "authoritative_thin_review_metadata",
              "authoritative_invalid_review_url",
              "authoritative_invalid_reviewed_at",
              "authoritative_placeholder_source_metadata",
              "authoritative_future_reviewed_at",
              "authoritative_non_so101_relevance_rejected",
              "authoritative_complete_source_review",
              "authoritative_single_root_complete_source_review",
              "authoritative_root_ambiguous",
          ], summary["case_ids"]
          assert summary["failed_case_ids"] == [], summary["failed_case_ids"]
          by_case = {case["case_id"]: case for case in summary["cases"]}
          preferred_candidate = by_case["candidate_prefer_top_level_model"]
          preferred_candidate_path = preferred_candidate["observations"]["source_intake_recommended_candidate_path"]
          preferred_candidate_root = preferred_candidate["observations"]["source_intake_recommended_candidate_source_root"]
          assert preferred_candidate["observations"]["source_intake_status"] == "source_authority_review_required", preferred_candidate
          assert preferred_candidate_path.endswith("/so101_synthetic_source.urdf"), preferred_candidate
          assert "/archive/" not in preferred_candidate_path, preferred_candidate
          assert ".nomesh." not in preferred_candidate_path, preferred_candidate
          assert preferred_candidate_root.endswith("/preferred_source_root"), preferred_candidate
          assert preferred_candidate["observations"]["source_intake_recommended_candidate_authoritative"] is False, preferred_candidate
          assert "run_so101_model_bundle_probe" in preferred_candidate["observations"]["next_required_action_ids"], preferred_candidate
          thin_review = by_case["authoritative_thin_review_metadata"]
          assert thin_review["observations"]["source_authority_gate_status"] == "source_authority_blocked_review_metadata", thin_review
          assert thin_review["observations"]["source_authority_review_status"] == "review_metadata_missing", thin_review
          assert thin_review["observations"]["source_authority_review_ready"] is False, thin_review
          assert "authority_reviewed_by" in thin_review["observations"]["source_authority_review_evidence_valid_fields"], thin_review
          assert "review_trace" in thin_review["observations"]["source_authority_review_evidence_missing_required_groups"], thin_review
          assert "review_artifact" in thin_review["observations"]["source_authority_review_evidence_missing_required_groups"], thin_review
          assert "record_source_authority_review_metadata" in thin_review["observations"]["next_required_action_ids"], thin_review
          angle_bracket_placeholder_review = by_case["authoritative_angle_bracket_placeholder_review_metadata"]
          assert angle_bracket_placeholder_review["observations"]["source_authority_gate_status"] == "source_authority_blocked_review_metadata", angle_bracket_placeholder_review
          assert angle_bracket_placeholder_review["observations"]["source_authority_review_status"] == "review_metadata_missing", angle_bracket_placeholder_review
          assert angle_bracket_placeholder_review["observations"]["source_authority_review_ready"] is False, angle_bracket_placeholder_review
          angle_bracket_review = angle_bracket_placeholder_review["observations"]["source_authority_review"]
          assert "authority_reviewed_by" in angle_bracket_review["review_evidence_placeholder_fields"], angle_bracket_placeholder_review
          assert "authority_reviewed_at" in angle_bracket_review["review_evidence_placeholder_fields"], angle_bracket_placeholder_review
          assert "authority_review_id" in angle_bracket_review["review_evidence_placeholder_fields"], angle_bracket_placeholder_review
          assert "record_source_authority_review_metadata" in angle_bracket_placeholder_review["observations"]["next_required_action_ids"], angle_bracket_placeholder_review
          invalid_review_url = by_case["authoritative_invalid_review_url"]
          assert invalid_review_url["observations"]["source_authority_gate_status"] == "source_authority_blocked_review_metadata", invalid_review_url
          assert "authority_review_url" in invalid_review_url["observations"]["source_authority_review_evidence_invalid_fields"], invalid_review_url
          assert "review_artifact" in invalid_review_url["observations"]["source_authority_review_evidence_missing_required_groups"], invalid_review_url
          invalid_reviewed_at = by_case["authoritative_invalid_reviewed_at"]
          assert invalid_reviewed_at["observations"]["source_authority_gate_status"] == "source_authority_blocked_review_metadata", invalid_reviewed_at
          assert invalid_reviewed_at["observations"]["source_authority_review_status"] == "review_metadata_missing", invalid_reviewed_at
          assert invalid_reviewed_at["observations"]["source_authority_review_ready"] is False, invalid_reviewed_at
          assert "authority_reviewed_at" in invalid_reviewed_at["observations"]["source_authority_review_evidence_invalid_fields"], invalid_reviewed_at
          assert "authority_reviewed_by" in invalid_reviewed_at["observations"]["source_authority_review_evidence_valid_fields"], invalid_reviewed_at
          assert "authority_review_id" in invalid_reviewed_at["observations"]["source_authority_review_evidence_valid_fields"], invalid_reviewed_at
          assert "record_source_authority_review_metadata" in invalid_reviewed_at["observations"]["next_required_action_ids"], invalid_reviewed_at
          future_reviewed_at = by_case["authoritative_future_reviewed_at"]
          assert future_reviewed_at["observations"]["source_authority_gate_status"] == "source_authority_blocked_review_metadata", future_reviewed_at
          assert future_reviewed_at["observations"]["source_authority_review_status"] == "review_metadata_missing", future_reviewed_at
          assert future_reviewed_at["observations"]["source_authority_review_ready"] is False, future_reviewed_at
          assert "authority_reviewed_at" in future_reviewed_at["observations"]["source_authority_review_evidence_invalid_fields"], future_reviewed_at
          assert "authority_reviewed_by" in future_reviewed_at["observations"]["source_authority_review_evidence_valid_fields"], future_reviewed_at
          assert "authority_review_id" in future_reviewed_at["observations"]["source_authority_review_evidence_valid_fields"], future_reviewed_at
          assert "record_source_authority_review_metadata" in future_reviewed_at["observations"]["next_required_action_ids"], future_reviewed_at
          placeholder_source_metadata = by_case["authoritative_placeholder_source_metadata"]
          assert placeholder_source_metadata["observations"]["source_authority_gate_status"] == "source_authority_blocked_review_metadata", placeholder_source_metadata
          assert placeholder_source_metadata["observations"]["source_authority_review_status"] == "review_metadata_missing", placeholder_source_metadata
          assert placeholder_source_metadata["observations"]["source_authority_review_ready"] is False, placeholder_source_metadata
          assert placeholder_source_metadata["observations"]["source_authority_missing_review_scope_ids"] == [], placeholder_source_metadata
          assert "authority_source_reference" in placeholder_source_metadata["observations"]["source_authority_required_metadata_placeholder_fields"], placeholder_source_metadata
          assert "authority_license_basis" in placeholder_source_metadata["observations"]["source_authority_required_metadata_placeholder_fields"], placeholder_source_metadata
          assert "record_source_authority_review_metadata" in placeholder_source_metadata["observations"]["next_required_action_ids"], placeholder_source_metadata
          non_so101 = by_case["authoritative_non_so101_relevance_rejected"]
          assert non_so101["observations"]["inventory_status"] == "authoritative_model_not_so101_relevant", non_so101
          assert non_so101["observations"]["source_authority_gate_status"] == "source_authority_blocked_candidate_not_so101_relevant", non_so101
          assert non_so101["observations"]["source_authority_review_ready"] is True, non_so101
          assert non_so101["observations"]["selected_authoritative_candidate_so101_relevance"] == "low", non_so101
          assert non_so101["observations"]["selected_authoritative_candidate_so101_relevance_ready"] is False, non_so101
          assert non_so101["observations"]["source_intake_status"] == "source_candidate_relevance_required", non_so101
          assert non_so101["observations"]["review_packet_status"] == "review_packet_authoritative_candidate_not_so101_relevant", non_so101
          assert "select_so101_relevant_authoritative_model_source" in non_so101["observations"]["next_required_action_ids"], non_so101
          assert "run_so101_model_bundle_probe" not in non_so101["observations"]["next_required_action_ids"], non_so101
          complete_source = by_case["authoritative_complete_source_review"]
          complete_source_obs = complete_source["observations"]
          assert complete_source_obs["source_authority_gate_status"] == "source_authority_ready", complete_source
          assert complete_source_obs["source_intake_status"] == "source_authority_ready_waiting_for_bundle_manifest", complete_source
          assert complete_source_obs["source_intake_recommended_candidate_path"] == complete_source_obs["selected_authoritative_candidate_path"], complete_source
          assert complete_source_obs["source_intake_recommended_candidate_authoritative"] is True, complete_source
          complete_source_inventory = json.loads(Path(complete_source["summary_path"]).read_text())
          complete_source_intake = complete_source_inventory["source_intake_checklist"]
          complete_probe_actions = [
              action for action in complete_source_intake["actions"]
              if action["action_id"] == "run_so101_model_bundle_probe"
          ]
          assert len(complete_probe_actions) == 1, complete_source_intake
          complete_probe_command = complete_probe_actions[0]["command"]
          assert complete_source_obs["selected_authoritative_candidate_path"] in complete_probe_command, complete_probe_command
          assert complete_source_obs["source_intake_recommended_candidate_source_root"] in complete_probe_command, complete_probe_command
          assert by_case["authoritative_single_root_complete_source_review"]["observations"]["source_authority_gate_status"] == "source_authority_ready", by_case["authoritative_single_root_complete_source_review"]
          assert by_case["authoritative_single_root_complete_source_review"]["observations"]["source_intake_status"] == "source_authority_ready_waiting_for_bundle_manifest", by_case["authoritative_single_root_complete_source_review"]
          assert by_case["authoritative_single_root_complete_source_review"]["observations"]["selected_authoritative_candidate_path"] == by_case["authoritative_complete_source_review"]["observations"]["selected_authoritative_candidate_path"], by_case
          assert by_case["authoritative_single_root_complete_source_review"]["observations"]["source_intake_recommended_candidate_path"] == by_case["authoritative_complete_source_review"]["observations"]["selected_authoritative_candidate_path"], by_case
          assert by_case["authoritative_single_root_complete_source_review"]["observations"]["source_intake_recommended_candidate_authoritative"] is True, by_case
          assert by_case["authoritative_root_ambiguous"]["observations"]["source_authority_gate_status"] == "source_authority_blocked_ambiguous_authoritative_model", by_case["authoritative_root_ambiguous"]
          assert by_case["authoritative_root_ambiguous"]["observations"]["source_intake_status"] == "single_source_selection_required", by_case["authoritative_root_ambiguous"]
          for case in summary["cases"]:
              observations = case["observations"]
              assert observations["source_intake_model_authority"] == "source_intake_not_authority", case
              assert observations["review_packet_model_authority"] == "review_packet_not_authority", case
              assert observations["source_intake_physical_so101_model_authority_ready"] is False, case
              assert observations["review_packet_physical_so101_model_authority_ready"] is False, case
          for relative_path in (
              "so101_source_authority_matrix_summary.json",
              "so101_source_authority_matrix_cases.csv",
              "README.md",
          ):
              assert (summary_path.parent / relative_path).is_file(), relative_path
          PY

      - name: Run SO-101 model bundle probe matrix
        run: |
          python scripts/smoke_sim_so101_model_bundle_probe_matrix.py \
            --output-dir "${SO101_MODEL_BUNDLE_PROBE_MATRIX_OUTPUT_DIR}" \
            --python "$(python -c 'import sys; print(sys.executable)')"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = Path(os.environ["SO101_MODEL_BUNDLE_PROBE_MATRIX_OUTPUT_DIR"]) / "so101_model_bundle_probe_matrix_summary.json"
          summary = json.loads(summary_path.read_text())
          assert summary["ok"] is True, summary
          assert summary["status"] == "ok", summary
          assert summary["model_authority"] == "model_bundle_probe_matrix_not_authority", summary
          assert summary["observed_evidence_is_physical_so101_authority"] is False, summary
          assert summary["ready_for_policy_training"] is False, summary
          assert summary["hardware_skipped"] is True, summary
          assert summary["gui_skipped"] is True, summary
          assert summary["openai_skipped"] is True, summary
          assert summary["case_ids"] == [
              "missing_model_probe_not_authority",
              "placeholder_authority_provenance_rejected",
              "invalid_reviewed_at_rejected",
              "future_reviewed_at_rejected",
              "valid_authority_provenance_still_draft_not_ready",
          ], summary["case_ids"]
          assert summary["failed_case_ids"] == [], summary["failed_case_ids"]
          by_case = {case["case_id"]: case for case in summary["cases"]}
          missing_model = by_case["missing_model_probe_not_authority"]["observations"]
          assert missing_model["status"] == "candidate_model_missing", missing_model
          assert missing_model["model_request_status"] == "model_not_supplied", missing_model
          assert missing_model["authority_empty"] is True, missing_model
          assert missing_model["provenance_empty"] is True, missing_model
          assert missing_model["authority_row_status"] == "action_required", missing_model
          assert missing_model["provenance_row_status"] == "action_required", missing_model
          assert "model_path" in missing_model["missing_inputs"], missing_model
          assert "authority" in missing_model["missing_inputs"], missing_model
          assert "provenance" in missing_model["missing_inputs"], missing_model
          placeholder = by_case["placeholder_authority_provenance_rejected"]["observations"]
          assert placeholder["status"] == "candidate_manifest_needs_review", placeholder
          assert placeholder["model_request_status"] == "model_supplied", placeholder
          assert placeholder["authority_empty"] is True, placeholder
          assert placeholder["provenance_empty"] is True, placeholder
          assert placeholder["authority_row_status"] == "action_required", placeholder
          assert placeholder["provenance_row_status"] == "action_required", placeholder
          assert placeholder["authority_placeholder_fields"] == [
              "review_id",
              "reviewed_at",
              "reviewed_by",
          ], placeholder
          assert placeholder["provenance_placeholder_fields"] == [
              "export_tool",
              "license",
              "source_url",
          ], placeholder
          assert "authority" in placeholder["missing_inputs"], placeholder
          assert "provenance" in placeholder["missing_inputs"], placeholder
          assert "record_reviewed_model_source_authority" in placeholder["next_required_action_ids"], placeholder
