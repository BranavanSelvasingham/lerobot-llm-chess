name: Simulator Calibration Regression

on:
  workflow_dispatch:

  pull_request:
    branches:
      - feat/telemetry-recording
    paths:
      - "archive/chess_test_images/current_view.jpg"
      - "docs/sim_calibration_regression.md"
      - "docs/sim_reference_capture_manifest.md"
      - "docs/sim_reference_media_inventory.md"
      - "docs/sim_so101_chess_env.md"
      - "docs/sim_so101_env_resets.md"
      - "docs/sim_so101_model_asset_preflight.md"
      - "docs/sim_so101_model_bundle_manifest.md"
      - "docs/sim_so101_model_contract.md"
      - "docs/sim_so101_model_source_inventory.md"
      - "docs/sim_so101_reviewed_mujoco_bundle.md"
      - "docs/sim_so101_mujoco_board_pick_probe.md"
      - "docs/sim_so101_mujoco_contact_probe.md"
      - "docs/sim_so101_mujoco_grasp_probe.md"
      - "docs/sim_so101_mujoco_scene.md"
      - "docs/sim_so101_training_rollouts.md"
      - "llm-tools/**"
      - "README.md"
      - "scripts/render_sim_*.py"
      - "scripts/smoke_sim_*.py"
      - "skills/**"
      - "src/lerobot/cameras/**"
      - "src/lerobot/configs/chessboard.py"
      - "src/lerobot/perception/chess/**"
      - "src/lerobot/sim/**"
      - "src/lerobot/utils/geometry.py"
      - ".github/workflows/sim_calibration_regression.yml"

  push:
    branches:
      - feat/telemetry-recording
    paths:
      - "archive/chess_test_images/current_view.jpg"
      - "docs/sim_calibration_regression.md"
      - "docs/sim_reference_capture_manifest.md"
      - "docs/sim_reference_media_inventory.md"
      - "docs/sim_so101_chess_env.md"
      - "docs/sim_so101_env_resets.md"
      - "docs/sim_so101_model_asset_preflight.md"
      - "docs/sim_so101_model_bundle_manifest.md"
      - "docs/sim_so101_model_contract.md"
      - "docs/sim_so101_model_source_inventory.md"
      - "docs/sim_so101_reviewed_mujoco_bundle.md"
      - "docs/sim_so101_mujoco_board_pick_probe.md"
      - "docs/sim_so101_mujoco_contact_probe.md"
      - "docs/sim_so101_mujoco_grasp_probe.md"
      - "docs/sim_so101_mujoco_scene.md"
      - "docs/sim_so101_training_rollouts.md"
      - "llm-tools/**"
      - "README.md"
      - "scripts/render_sim_*.py"
      - "scripts/smoke_sim_*.py"
      - "skills/**"
      - "src/lerobot/cameras/**"
      - "src/lerobot/configs/chessboard.py"
      - "src/lerobot/perception/chess/**"
      - "src/lerobot/sim/**"
      - "src/lerobot/utils/geometry.py"
      - ".github/workflows/sim_calibration_regression.yml"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  CALIBRATION_REGRESSION_OUTPUT_DIR: "/tmp/lerobot_sim/calibration_regression_suite"
  SO101_SOURCE_AUTHORITY_MATRIX_OUTPUT_DIR: "/tmp/lerobot_sim/so101_source_authority_matrix"
  SO101_REVIEWED_AUTHORITY_GATE_MATRIX_OUTPUT_DIR: "/tmp/lerobot_sim/so101_reviewed_authority_gate_matrix"
  SO101_REVIEWED_MUJOCO_BUNDLE_MATRIX_OUTPUT_DIR: "/tmp/lerobot_sim/so101_reviewed_mujoco_bundle_matrix"
  SO101_MUJOCO_SCENE_MATRIX_OUTPUT_DIR: "/tmp/lerobot_sim/so101_mujoco_scene_matrix"
  SO101_CHESS_ENV_MATRIX_OUTPUT_DIR: "/tmp/lerobot_sim/so101_chess_env_matrix"
  SO101_BOARD_PICK_PROBE_MATRIX_OUTPUT_DIR: "/tmp/lerobot_sim/so101_mujoco_board_pick_probe_matrix"
  SO101_TRAINING_ROLLOUTS_MATRIX_OUTPUT_DIR: "/tmp/lerobot_sim/so101_training_rollouts_matrix"
  SO101_TRAINING_READINESS_GATE_MATRIX_OUTPUT_DIR: "/tmp/lerobot_sim/so101_training_readiness_gate_matrix"
  CALIBRATION_REGRESSION_ARTIFACT_NAME: "sim-calibration-regression-${{ github.run_id }}"
  REFERENCE_MEDIA_ROOTS: ""
  REFERENCE_CAPTURE_MANIFEST: ""
  IK_MODEL_PATH: ""
  IK_MODEL_ASSET_ROOTS: ""
  SO101_MODEL_BUNDLE_MANIFEST: ""
  SO101_MODEL_SOURCE_ROOTS: ""
  SO101_MODEL_SOURCE_EXTRA_ROOTS: ""
  SO101_AUTHORITATIVE_MODEL_PATHS: ""
  SO101_AUTHORITATIVE_MODEL_ROOTS: ""
  SO101_SOURCE_AUTHORITY_REVIEWED_BY: ""
  SO101_SOURCE_AUTHORITY_REVIEWED_AT: ""
  SO101_SOURCE_AUTHORITY_REVIEW_ID: ""
  SO101_SOURCE_AUTHORITY_REVIEW_URL: ""
  SO101_SOURCE_AUTHORITY_SOURCE_REFERENCE: ""
  SO101_SOURCE_AUTHORITY_REVIEW_SCOPES: ""
  SO101_SOURCE_AUTHORITY_LICENSE_BASIS: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  sim-calibration-regression:
    name: Hardware-free calibration gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install suite dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            deepdiff \
            draccus \
            gymnasium \
            huggingface-hub \
            mujoco \
            numpy \
            opencv-python-headless \
            pyserial \
            "torch>=2.2.1,<2.8.0" \
            tqdm

      - name: Run simulator calibration regression suite
        run: |
          append_repeatable_args() {
            local flag="$1"
            local values="$2"
            if [ -z "${values}" ]; then
              return 0
            fi
            while IFS= read -r value; do
              if [ -n "${value}" ]; then
                cmd+=("${flag}" "${value}")
              fi
            done <<< "${values}"
          }

          cmd=(
            python
            scripts/smoke_sim_calibration_regression_suite.py
            --output-dir "${CALIBRATION_REGRESSION_OUTPUT_DIR}"
            --python "$(python -c 'import sys; print(sys.executable)')"
            --include-negative-check
          )
          append_repeatable_args --reference-media-root "${REFERENCE_MEDIA_ROOTS}"
          if [ -n "${REFERENCE_CAPTURE_MANIFEST}" ]; then
            cmd+=(--reference-capture-manifest "${REFERENCE_CAPTURE_MANIFEST}")
          fi
          if [ -n "${IK_MODEL_PATH}" ]; then
            cmd+=(--ik-model-path "${IK_MODEL_PATH}")
          fi
          if [ -n "${SO101_MODEL_BUNDLE_MANIFEST}" ]; then
            cmd+=(--so101-model-bundle-manifest "${SO101_MODEL_BUNDLE_MANIFEST}")
          fi
          append_repeatable_args --ik-model-asset-root "${IK_MODEL_ASSET_ROOTS}"
          append_repeatable_args --so101-model-source-root "${SO101_MODEL_SOURCE_ROOTS}"
          append_repeatable_args --so101-model-source-extra-root "${SO101_MODEL_SOURCE_EXTRA_ROOTS}"
          append_repeatable_args --so101-authoritative-model-path "${SO101_AUTHORITATIVE_MODEL_PATHS}"
          append_repeatable_args --so101-authoritative-model-root "${SO101_AUTHORITATIVE_MODEL_ROOTS}"
          if [ -n "${SO101_SOURCE_AUTHORITY_REVIEWED_BY}" ]; then
            cmd+=(--so101-source-authority-reviewed-by "${SO101_SOURCE_AUTHORITY_REVIEWED_BY}")
          fi
          if [ -n "${SO101_SOURCE_AUTHORITY_REVIEWED_AT}" ]; then
            cmd+=(--so101-source-authority-reviewed-at "${SO101_SOURCE_AUTHORITY_REVIEWED_AT}")
          fi
          if [ -n "${SO101_SOURCE_AUTHORITY_REVIEW_ID}" ]; then
            cmd+=(--so101-source-authority-review-id "${SO101_SOURCE_AUTHORITY_REVIEW_ID}")
          fi
          if [ -n "${SO101_SOURCE_AUTHORITY_REVIEW_URL}" ]; then
            cmd+=(--so101-source-authority-review-url "${SO101_SOURCE_AUTHORITY_REVIEW_URL}")
          fi
          if [ -n "${SO101_SOURCE_AUTHORITY_SOURCE_REFERENCE}" ]; then
            cmd+=(--so101-source-authority-source-reference "${SO101_SOURCE_AUTHORITY_SOURCE_REFERENCE}")
          fi
          append_repeatable_args --so101-source-authority-review-scope "${SO101_SOURCE_AUTHORITY_REVIEW_SCOPES}"
          if [ -n "${SO101_SOURCE_AUTHORITY_LICENSE_BASIS}" ]; then
            cmd+=(--so101-source-authority-license-basis "${SO101_SOURCE_AUTHORITY_LICENSE_BASIS}")
          fi
          "${cmd[@]}"

      - name: Run SO-101 source authority matrix
        run: |
          python scripts/smoke_sim_so101_source_authority_matrix.py \
            --output-dir "${SO101_SOURCE_AUTHORITY_MATRIX_OUTPUT_DIR}" \
            --python "$(python -c 'import sys; print(sys.executable)')"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = Path(os.environ["SO101_SOURCE_AUTHORITY_MATRIX_OUTPUT_DIR"]) / "so101_source_authority_matrix_summary.json"
          summary = json.loads(summary_path.read_text())
          assert summary["ok"] is True, summary
          assert summary["status"] == "ok", summary
          assert summary["hardware_skipped"] is True, summary
          assert summary["gui_skipped"] is True, summary
          assert summary["openai_skipped"] is True, summary
          assert summary["case_ids"] == [
              "missing_source_root",
              "candidate_unverified",
              "authoritative_missing_review_metadata",
              "authoritative_placeholder_review_metadata",
              "authoritative_thin_review_metadata",
              "authoritative_invalid_review_url",
              "authoritative_placeholder_source_metadata",
              "authoritative_complete_source_review",
              "authoritative_single_root_complete_source_review",
              "authoritative_root_ambiguous",
          ], summary["case_ids"]
          assert summary["failed_case_ids"] == [], summary["failed_case_ids"]
          by_case = {case["case_id"]: case for case in summary["cases"]}
          thin_review = by_case["authoritative_thin_review_metadata"]
          assert thin_review["observations"]["source_authority_gate_status"] == "source_authority_blocked_review_metadata", thin_review
          assert thin_review["observations"]["source_authority_review_status"] == "review_metadata_missing", thin_review
          assert thin_review["observations"]["source_authority_review_ready"] is False, thin_review
          assert "authority_reviewed_by" in thin_review["observations"]["source_authority_review_evidence_valid_fields"], thin_review
          assert "review_trace" in thin_review["observations"]["source_authority_review_evidence_missing_required_groups"], thin_review
          assert "review_artifact" in thin_review["observations"]["source_authority_review_evidence_missing_required_groups"], thin_review
          assert "record_source_authority_review_metadata" in thin_review["observations"]["next_required_action_ids"], thin_review
          invalid_review_url = by_case["authoritative_invalid_review_url"]
          assert invalid_review_url["observations"]["source_authority_gate_status"] == "source_authority_blocked_review_metadata", invalid_review_url
          assert "authority_review_url" in invalid_review_url["observations"]["source_authority_review_evidence_invalid_fields"], invalid_review_url
          assert "review_artifact" in invalid_review_url["observations"]["source_authority_review_evidence_missing_required_groups"], invalid_review_url
          placeholder_source_metadata = by_case["authoritative_placeholder_source_metadata"]
          assert placeholder_source_metadata["observations"]["source_authority_gate_status"] == "source_authority_blocked_review_metadata", placeholder_source_metadata
          assert placeholder_source_metadata["observations"]["source_authority_review_status"] == "review_metadata_missing", placeholder_source_metadata
          assert placeholder_source_metadata["observations"]["source_authority_review_ready"] is False, placeholder_source_metadata
          assert placeholder_source_metadata["observations"]["source_authority_missing_review_scope_ids"] == [], placeholder_source_metadata
          assert "authority_source_reference" in placeholder_source_metadata["observations"]["source_authority_required_metadata_placeholder_fields"], placeholder_source_metadata
          assert "authority_license_basis" in placeholder_source_metadata["observations"]["source_authority_required_metadata_placeholder_fields"], placeholder_source_metadata
          assert "record_source_authority_review_metadata" in placeholder_source_metadata["observations"]["next_required_action_ids"], placeholder_source_metadata
          assert by_case["authoritative_complete_source_review"]["observations"]["source_authority_gate_status"] == "source_authority_ready", by_case["authoritative_complete_source_review"]
          assert by_case["authoritative_complete_source_review"]["observations"]["source_intake_status"] == "source_authority_ready_waiting_for_bundle_manifest", by_case["authoritative_complete_source_review"]
          assert by_case["authoritative_single_root_complete_source_review"]["observations"]["source_authority_gate_status"] == "source_authority_ready", by_case["authoritative_single_root_complete_source_review"]
          assert by_case["authoritative_single_root_complete_source_review"]["observations"]["source_intake_status"] == "source_authority_ready_waiting_for_bundle_manifest", by_case["authoritative_single_root_complete_source_review"]
          assert by_case["authoritative_single_root_complete_source_review"]["observations"]["selected_authoritative_candidate_path"] == by_case["authoritative_complete_source_review"]["observations"]["selected_authoritative_candidate_path"], by_case
          assert by_case["authoritative_root_ambiguous"]["observations"]["source_authority_gate_status"] == "source_authority_blocked_ambiguous_authoritative_model", by_case["authoritative_root_ambiguous"]
          assert by_case["authoritative_root_ambiguous"]["observations"]["source_intake_status"] == "single_source_selection_required", by_case["authoritative_root_ambiguous"]
          for case in summary["cases"]:
              observations = case["observations"]
              assert observations["source_intake_model_authority"] == "source_intake_not_authority", case
              assert observations["review_packet_model_authority"] == "review_packet_not_authority", case
              assert observations["source_intake_physical_so101_model_authority_ready"] is False, case
              assert observations["review_packet_physical_so101_model_authority_ready"] is False, case
          for relative_path in (
              "so101_source_authority_matrix_summary.json",
              "so101_source_authority_matrix_cases.csv",
              "README.md",
          ):
              assert (summary_path.parent / relative_path).is_file(), relative_path
          PY

      - name: Run SO-101 reviewed authority gate matrix
        run: |
          python scripts/smoke_sim_so101_reviewed_authority_gate_matrix.py \
            --output-dir "${SO101_REVIEWED_AUTHORITY_GATE_MATRIX_OUTPUT_DIR}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = Path(os.environ["SO101_REVIEWED_AUTHORITY_GATE_MATRIX_OUTPUT_DIR"]) / "so101_reviewed_authority_gate_matrix_summary.json"
          summary = json.loads(summary_path.read_text())
          assert summary["ok"] is True, summary
          assert summary["status"] == "ok", summary
          assert summary["model_authority"] == "contract_matrix_not_authority", summary
          assert summary["observed_evidence_is_authority"] is False, summary
          assert summary["physical_so101_model_authority_ready"] is False, summary
          assert summary["hardware_skipped"] is True, summary
          assert summary["gui_skipped"] is True, summary
          assert summary["openai_skipped"] is True, summary
          assert summary["case_ids"] == [
              "source_missing_bundle_missing_motion_missing",
              "source_ready_bundle_missing",
              "source_missing_physical_bundle_ready",
              "source_ready_missing_selected_path_physical_bundle_ready",
              "source_ready_unconfigured_selection_physical_bundle_ready",
              "source_ready_selection_outside_authority_physical_bundle_ready",
              "source_ready_physical_bundle_missing_model_path",
              "source_ready_physical_bundle_path_mismatch",
              "source_ready_physical_bundle_same_root_unselected_model",
              "source_ready_physical_bundle_path_match_motion_missing",
              "source_ready_physical_bundle_digest_missing",
              "source_ready_physical_bundle_declared_digest_missing",
              "source_ready_physical_bundle_observed_digest_missing",
              "source_ready_physical_bundle_observed_digest_mismatch",
              "source_ready_physical_bundle_digest_mismatch",
              "source_ready_physical_bundle_motion_status_inconsistent",
              "source_ready_physical_bundle_motion_model_path_missing",
              "source_ready_physical_bundle_motion_model_digest_missing",
              "source_ready_physical_bundle_motion_model_path_mismatch",
              "source_ready_physical_bundle_motion_model_digest_mismatch",
              "source_ready_hardware_free_bundle_fixture",
              "source_ready_physical_bundle_fixture_motion_not_physical",
              "source_ready_physical_bundle_with_fixture_ready_conflict",
              "source_ready_physical_motion_with_fixture_motion_conflict",
              "all_ready_contract_state",
          ], summary["case_ids"]
          assert summary["failed_case_ids"] == [], summary["failed_case_ids"]
          by_case = {case["case_id"]: case for case in summary["cases"]}
          source_selected_missing_case = by_case["source_ready_missing_selected_path_physical_bundle_ready"]
          source_selected_missing = source_selected_missing_case["gate"]
          assert source_selected_missing["ready"] is False, source_selected_missing
          assert source_selected_missing["source_bundle_consistency_status"] == "source_authoritative_model_path_missing", source_selected_missing
          assert source_selected_missing["source_bundle_consistency"]["selected_authoritative_candidate_path"] is None, source_selected_missing
          assert source_selected_missing["source_bundle_consistency"]["selected_authoritative_candidate_path_matches_bundle"] is False, source_selected_missing
          assert source_selected_missing["source_bundle_consistency"]["selected_authoritative_candidate_sha256_matches_bundle"] is True, source_selected_missing
          assert "select_reviewed_authoritative_so101_source_model_path" in source_selected_missing["next_required_action_ids"], source_selected_missing
          assert "select_reviewed_authoritative_so101_source_model_path" in source_selected_missing_case["blocker_packet"]["next_action_ids"], source_selected_missing_case
          unconfigured_selection_case = by_case["source_ready_unconfigured_selection_physical_bundle_ready"]
          unconfigured_selection = unconfigured_selection_case["gate"]
          assert unconfigured_selection["ready"] is False, unconfigured_selection
          assert unconfigured_selection["source_bundle_consistency_status"] == "source_authoritative_model_selection_unconfigured", unconfigured_selection
          assert unconfigured_selection["source_bundle_consistency"]["selected_authoritative_candidate_path_matches_bundle"] is True, unconfigured_selection
          assert unconfigured_selection["source_bundle_consistency"]["selected_authoritative_candidate_sha256_matches_bundle"] is True, unconfigured_selection
          assert unconfigured_selection["source_bundle_consistency"]["selected_authoritative_candidate_declared_by_authoritative_path"] is False, unconfigured_selection
          assert unconfigured_selection["source_bundle_consistency"]["selected_authoritative_candidate_within_authoritative_root"] is False, unconfigured_selection
          assert unconfigured_selection["source_bundle_consistency"]["selected_authoritative_candidate_covered_by_source_configuration"] is False, unconfigured_selection
          assert "declare_reviewed_authoritative_so101_source_path_or_root" in unconfigured_selection["next_required_action_ids"], unconfigured_selection
          assert "declare_reviewed_authoritative_so101_source_path_or_root" in unconfigured_selection_case["blocker_packet"]["next_action_ids"], unconfigured_selection_case
          outside_selection_case = by_case["source_ready_selection_outside_authority_physical_bundle_ready"]
          outside_selection = outside_selection_case["gate"]
          assert outside_selection["ready"] is False, outside_selection
          assert outside_selection["source_bundle_consistency_status"] == "source_authoritative_model_selection_mismatch", outside_selection
          assert outside_selection["source_bundle_consistency"]["selected_authoritative_candidate_path_matches_bundle"] is True, outside_selection
          assert outside_selection["source_bundle_consistency"]["selected_authoritative_candidate_sha256_matches_bundle"] is True, outside_selection
          assert outside_selection["source_bundle_consistency"]["selected_authoritative_candidate_declared_by_authoritative_path"] is False, outside_selection
          assert outside_selection["source_bundle_consistency"]["selected_authoritative_candidate_within_authoritative_root"] is False, outside_selection
          assert outside_selection["source_bundle_consistency"]["selected_authoritative_candidate_covered_by_source_configuration"] is False, outside_selection
          assert "align_selected_so101_source_model_with_authoritative_declaration" in outside_selection["next_required_action_ids"], outside_selection
          assert "align_selected_so101_source_model_with_authoritative_declaration" in outside_selection_case["blocker_packet"]["next_action_ids"], outside_selection_case
          mismatch = by_case["source_ready_physical_bundle_path_mismatch"]["gate"]
          assert mismatch["ready"] is False, mismatch
          assert mismatch["source_bundle_consistency_status"] == "source_bundle_model_path_mismatch", mismatch
          assert "align_source_inventory_with_bundle_manifest_model_path" in mismatch["next_required_action_ids"], mismatch
          same_root = by_case["source_ready_physical_bundle_same_root_unselected_model"]["gate"]
          assert same_root["ready"] is False, same_root
          assert same_root["source_bundle_consistency_status"] == "source_bundle_model_path_mismatch", same_root
          assert same_root["physical_reviewed_model_motion_child_ready"] is True, same_root
          assert same_root["physical_reviewed_model_motion_checked"] is False, same_root
          assert same_root["reviewed_mujoco_motion_bundle_consistency_status"] == "not_checked_prerequisites_not_ready", same_root
          assert same_root["development_fixture_evidence_not_physical_so101_truth"] is True, same_root
          assert "align_source_inventory_with_bundle_manifest_model_path" in same_root["next_required_action_ids"], same_root
          digest_missing_case = by_case["source_ready_physical_bundle_digest_missing"]
          digest_missing = digest_missing_case["gate"]
          assert digest_missing["ready"] is False, digest_missing
          assert digest_missing["source_bundle_consistency_status"] == "source_bundle_model_digest_missing", digest_missing
          assert digest_missing["source_bundle_consistency"]["selected_authoritative_candidate_path_matches_bundle"] is True, digest_missing
          assert digest_missing["source_bundle_consistency"]["selected_authoritative_candidate_sha256_matches_bundle"] is False, digest_missing
          assert "record_reviewed_so101_model_file_sha256" in digest_missing["next_required_action_ids"], digest_missing
          assert "record_reviewed_so101_model_file_sha256" in digest_missing_case["blocker_packet"]["next_action_ids"], digest_missing_case
          declared_digest_missing_case = by_case["source_ready_physical_bundle_declared_digest_missing"]
          declared_digest_missing = declared_digest_missing_case["gate"]
          assert declared_digest_missing["ready"] is False, declared_digest_missing
          assert declared_digest_missing["source_bundle_consistency_status"] == "source_bundle_model_digest_missing", declared_digest_missing
          assert declared_digest_missing["source_bundle_consistency"]["selected_authoritative_candidate_path_matches_bundle"] is True, declared_digest_missing
          assert declared_digest_missing["source_bundle_consistency"]["selected_authoritative_candidate_sha256_matches_bundle"] is False, declared_digest_missing
          assert declared_digest_missing["source_bundle_consistency"]["bundle_model_declared_sha256"] is None, declared_digest_missing
          assert declared_digest_missing["source_bundle_consistency"]["bundle_model_observed_sha256"] == "a" * 64, declared_digest_missing
          assert declared_digest_missing["source_bundle_consistency"]["bundle_model_sha256"] is None, declared_digest_missing
          assert "record_reviewed_so101_model_file_sha256" in declared_digest_missing["next_required_action_ids"], declared_digest_missing
          assert "record_reviewed_so101_model_file_sha256" in declared_digest_missing_case["blocker_packet"]["next_action_ids"], declared_digest_missing_case
          observed_digest_missing_case = by_case["source_ready_physical_bundle_observed_digest_missing"]
          observed_digest_missing = observed_digest_missing_case["gate"]
          assert observed_digest_missing["ready"] is False, observed_digest_missing
          assert observed_digest_missing["source_bundle_consistency_status"] == "bundle_model_observed_digest_missing", observed_digest_missing
          assert observed_digest_missing["source_bundle_consistency"]["selected_authoritative_candidate_path_matches_bundle"] is True, observed_digest_missing
          assert observed_digest_missing["source_bundle_consistency"]["selected_authoritative_candidate_sha256_matches_bundle"] is True, observed_digest_missing
          assert observed_digest_missing["source_bundle_consistency"]["bundle_model_declared_sha256"] == "a" * 64, observed_digest_missing
